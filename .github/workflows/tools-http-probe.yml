name: Tools · HTTP probe

# Read-only diagnostic of one hostname, run from the GitHub runner (which,
# unlike the Claude sandbox, can reach any public site):
#   • the raw response of http:// and https:// for the apex and www
#     (status, Location, Server…), redirects NOT followed
#   • the full redirect chain of the http:// URL (up to 8 hops)
#   • the TLS certificate presented on :443 (subject, issuer, validity, SANs)
# Useful to tell "redirect works but only over HTTP" from "no redirect at all".

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Hostname to probe, e.g. complorama.fr (no scheme, no path)'
        required: true
        default: 'complorama.fr'
      www:
        description: 'Also probe the www. variant'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      IN_HOST: ${{ inputs.host }}
      IN_WWW: ${{ inputs.www }}
    steps:
      - name: Probe
        run: |
          host="$(printf '%s' "$IN_HOST" | tr -d '[:space:]' | sed -E 's#^https?://##; s#/.*$##')"
          case "$host" in
            *.*) ;;
            *) echo "::error::'$IN_HOST' is not a hostname"; exit 1 ;;
          esac
          hosts=("$host"); [ "$IN_WWW" = "true" ] && hosts+=("www.$host")

          bar() { printf '\n%s\n%s\n%s\n' "$(printf '═%.0s' {1..70})" "$1" "$(printf '═%.0s' {1..70})"; }

          bar "1 · DNS"
          for h in "${hosts[@]}"; do
            echo "  $h"
            getent ahosts "$h" | awk '{print "    " $1}' | sort -u || echo "    (no answer)"
          done

          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          bar "2 · Raw responses (redirects not followed)"
          for h in "${hosts[@]}"; do
            for scheme in http https; do
              echo
              echo "▸ $scheme://$h/"
              if ! curl -sS -o /dev/null -D - --max-time 20 --max-redirs 0 "$scheme://$h/" 2>&1 | sed 's/^/    /'; then
                echo "    (curl failed — see message above)"
              fi
              # Same request as a phone browser: status, Location, first words of
              # the body (tells an Apache "Forbidden" from an OVH parking page).
              body="$(curl -sS --max-time 20 --max-redirs 0 -A "$UA" -w '\n@@%{http_code}|%{redirect_url}' "$scheme://$h/" 2>/dev/null || true)"
              meta="${body##*@@}"; body="${body%@@*}"
              code="${meta%%|*}"; loc="${meta#*|}"
              text="$(printf '%s' "$body" | sed -e 's/<[^>]*>/ /g' | tr -s '[:space:]' ' ' | cut -c1-200)"
              echo "    as a phone browser: HTTP ${code:-?}${loc:+ → $loc} · body: ${text:-(empty)}"
            done
          done

          bar "5 · Same URL, different clients (User-Agent matrix) — https://$host/"
          printf '    %-22s %-6s %s\n' CLIENT HTTP LOCATION
          while IFS='|' read -r label ua; do
            meta="$(curl -sS -o /dev/null --max-time 20 --max-redirs 0 -A "$ua" -w '%{http_code}|%{redirect_url}' "https://$host/" 2>/dev/null || echo 'ERR|')"
            printf '    %-22s %-6s %s\n' "$label" "${meta%%|*}" "${meta#*|}"
          done <<'EOF'
          Safari iPhone|Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1
          Chrome desktop|Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36
          Googlebot|Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)
          Bingbot|Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm) Chrome/116.0.1938.76 Safari/537.36
          facebookexternalhit|facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)
          Twitterbot|Twitterbot/1.0
          WhatsApp|WhatsApp/2.23.20.0
          Slackbot|Slackbot-LinkExpanding 1.0 (+https://api.slack.com/robots)
          Mastodon|http.rb/5.1.1 (Mastodon/4.2.0; +https://mastodon.social/)
          curl|curl/8.5.0
          wget|Wget/1.21.4
          python-requests|python-requests/2.31
          (empty UA)|
          EOF

          bar "3 · Redirect chain from http://$host/"
          curl -sS -o /dev/null -L --max-redirs 8 --max-time 40 \
            -w '    %{url_effective}  ←  final URL after %{num_redirects} redirect(s), HTTP %{http_code}\n' \
            "http://$host/" 2>&1 || echo "    (chain broken — see message above)"
          curl -sS -o /dev/null -L --max-redirs 8 --max-time 40 -D - "http://$host/" 2>/dev/null \
            | grep -iE '^(HTTP/|location:)' | sed 's/^/    /' || true

          bar "4 · TLS certificate presented on :443"
          for h in "${hosts[@]}"; do
            echo
            echo "▸ $h"
            if cert="$(echo | timeout 20 openssl s_client -servername "$h" -connect "$h:443" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null)"; then
              echo "$cert" | sed 's/^/    /'
              parent="${h#*.}"
              if echo "$cert" | grep -qiE "DNS:${h//./\\.}(,|$| )|DNS:\*\.${parent//./\\.}(,|$| )"; then
                echo "    ✓ the certificate covers $h"
              else
                echo "    ✗ the certificate does NOT cover $h → browsers show a security warning on https://$h/"
              fi
            else
              echo "    (no TLS handshake — port 443 closed, or the server refused the connection)"
            fi
          done
          echo
