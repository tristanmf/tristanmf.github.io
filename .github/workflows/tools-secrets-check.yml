name: Tools · Secrets check

# Which repository secrets are configured — names and presence only, never
# values. A workflow cannot enumerate secrets, so this probes a fixed list of
# the names this project uses or might use, and reports "défini" / "absent"
# plus the length of the value as a sanity check (a secret pasted with a
# trailing newline or truncated shows up here).
#
# Use it before asking Tristan to create a secret: he may already have made
# one under a slightly different name.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # OVH API (in use since September 2026)
      OVH_APP_KEY: ${{ secrets.OVH_APP_KEY }}
      OVH_APP_SECRET: ${{ secrets.OVH_APP_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
      # SFTP deployment to the egoblog.net hosting — candidate names
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_PASS: ${{ secrets.OVH_SFTP_PASS }}
      OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
      OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
      OVH_SSH_PASSWORD: ${{ secrets.OVH_SSH_PASSWORD }}
      OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_USER: ${{ secrets.FTP_USER }}
      # Optional non-secret variable
      OVH_ENDPOINT: ${{ vars.OVH_ENDPOINT }}
    steps:
      - name: Report
        run: |
          names="OVH_APP_KEY OVH_APP_SECRET OVH_CONSUMER_KEY
                 OVH_SFTP_PASSWORD OVH_SFTP_USER OVH_SFTP_HOST OVH_SFTP_PASS
                 OVH_FTP_PASSWORD OVH_FTP_USER OVH_SSH_PASSWORD OVH_SSH_USER
                 SFTP_PASSWORD SFTP_USER SFTP_HOST FTP_PASSWORD FTP_USER"
          printf '\n  %-22s %-10s %s\n' 'SECRET' 'ÉTAT' 'LONGUEUR'
          printf '  %s\n' '--------------------------------------------------'
          found=0
          for n in $names; do
            v="${!n}"
            if [ -n "$v" ]; then
              printf '  %-22s %-10s %s caractères\n' "$n" 'défini' "${#v}"
              found=$((found+1))
              case "$v" in
                *' ') echo "      ⚠ se termine par une espace — probablement une erreur de copie" ;;
              esac
            else
              printf '  %-22s %-10s\n' "$n" 'absent'
            fi
          done
          printf '\n  %s secret(s) défini(s) sur les %s noms testés.\n' "$found" "$(echo $names | wc -w)"
          printf '  Variable OVH_ENDPOINT : %s\n\n' "${OVH_ENDPOINT:-non définie (le défaut eu.api.ovh.com est utilisé)}"
