name: Sync new episodes

on:
  schedule:
    # Times are UTC. Paris is UTC+2 in summer (CEST), UTC+1 in winter (CET).
    # Cron may be delayed by a few minutes during GitHub peak hours.
    #
    # Two passes a day, every day. Each run is idempotent (no-op + no
    # commit when nothing changed, ~15s), so this costs nothing and — unlike
    # the previous Fri/Sat/Mon/Thu schedule — it doesn't depend on which
    # weekday the show publishes. Worst case an episode / video / artwork
    # is picked up within 12h of Radio France or YouTube exposing it.
    - cron: '0 18 * * *'   # 18:00 UTC = ~20:00 Paris
    - cron: '0 8 * * *'    # 08:00 UTC = ~10:00 Paris
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Append new episodes from RSS + back-fill YouTube
        run: node scripts/sync-new-episodes.mjs

      - name: Fetch missing descriptions + upgrade generic show art
        run: node scripts/fetch-episode-descriptions.mjs

      - name: Mirror episode images locally
        run: node scripts/download-episode-images.mjs

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complorama/assets/episodes complorama/episodes-data.js
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(complorama): auto-sync new episodes + YouTube links"
            git push
          fi
