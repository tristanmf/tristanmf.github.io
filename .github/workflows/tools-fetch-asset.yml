name: Tools · Fetch asset

# Dev helper. Downloads one remote file onto the runner and commits it at the
# given repository path — for mirroring third-party assets (avatars, logos…)
# so the site stops contacting external domains at page load. Run it from
# the Actions tab.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Remote file to download'
        required: true
      dest:
        description: 'Repository path to write it to (e.g. complorama/assets/foo.jpg)'
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url }}
      DEST: ${{ inputs.dest }}
    steps:
      - uses: actions/checkout@v4

      - name: Download
        run: |
          set -euo pipefail
          case "$DEST" in
            *..*|/*) echo "Refusing dest outside the repo: $DEST"; exit 1 ;;
          esac
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36" -o "$DEST" "$URL"
          echo "Saved: $(ls -la "$DEST")"
          echo "Type:  $(file -b "$DEST")"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: mirror asset $DEST [skip ci]"
            git push
          fi
