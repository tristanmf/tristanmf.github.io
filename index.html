<style>
  html, body { background: #000; color: #fff; }
  body { font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; }
  .font-heading { font-family: 'Instrument Serif', serif; }
  .font-body { font-family: 'Barlow', sans-serif; }

  .liquid-glass {
    background: rgba(255, 255, 255, 0.04);
    background-blend-mode: luminosity;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.45) 0%,
      rgba(255, 255, 255, 0.15) 20%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.15) 80%,
      rgba(255, 255, 255, 0.45) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  .liquid-glass-strong {
    background: rgba(255, 255, 255, 0.06);
    background-blend-mode: luminosity;
    backdrop-filter: blur(50px);
    -webkit-backdrop-filter: blur(50px);
    border: none;
    box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.05),
      inset 0 1px 1px rgba(255, 255, 255, 0.15);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass-strong::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.5) 0%,
      rgba(255, 255, 255, 0.2) 20%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.2) 80%,
      rgba(255, 255, 255, 0.5) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  /* content above pseudo-element */
  .liquid-glass > *, .liquid-glass-strong > * { position: relative; z-index: 1; }

  .desat { filter: saturate(0); }

  @media (prefers-reduced-motion: reduce) {
    .aurora-blob { animation: none; }
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* subtle vignette grain on body to keep premium feel on the pure-black gaps */
  .bg-noise {
    background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  /* Aurora blobs : halos bleu et violet translucides en arrière-plan,
     visibles sur les sections noires entre les vidéos */
  .aurora-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.22;
    z-index: 0;
    pointer-events: none;
    will-change: transform;
    animation: aurora-float 16s ease-in-out infinite;
  }
  .aurora-blob.blob-1 {
    width: 520px; height: 520px;
    background: #3b82f6;
    top: 18%; left: -12%;
    animation-delay: 0s;
  }
  .aurora-blob.blob-2 {
    width: 440px; height: 440px;
    background: #8b5cf6;
    bottom: 14%; right: -8%;
    animation-delay: -8s;
  }
  @keyframes aurora-float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, 30px) scale(1.08); }
  }
  @media (max-width: 767px) {
    .aurora-blob.blob-1 { width: 320px; height: 320px; filter: blur(70px); }
    .aurora-blob.blob-2 { width: 280px; height: 280px; filter: blur(70px); }
  }

  /* Fondu doux des bords des vidéos vers le noir ambiant (aurora blobs) */
  .edge-fade-bottom {
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 62%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 0%, black 62%, transparent 100%);
  }
  .edge-fade-top {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 38%, black 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 38%, black 100%);
  }
  /* Hero : au moins un écran (plafonné à 1000px), mais libre de s'étirer si le
     contenu déborde — sinon l'indicateur de défilement se fait rogner. */
  @media (min-width: 768px) {
    #top { min-height: min(100vh, 1000px); }
  }

  .edge-fade-both {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 78%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 78%, transparent 100%);
  }
